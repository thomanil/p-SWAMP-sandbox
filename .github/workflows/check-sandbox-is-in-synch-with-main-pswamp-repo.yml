# Checks that this sandbox and the main p-SWAMP repo still work together, both ways:
#
#   sandbox-against-pswamp      — this repo's tests and scripts, run against the tip of
#                                 p-SWAMP's branch (README.md, "Where p-SWAMP comes from":
#                                 `uv run --with-editable ../p-swamp/...`), not the commit
#                                 uv.lock pins, so an upstream change that breaks us shows up
#   pswamp-loads-sandbox-module — p-SWAMP's full stack loading this repo as an external
#                                 module (README.md, "Trying it in the full stack":
#                                 `uv run pswamp dev server --extra-modules ../p-SWAMP-sandbox`),
#                                 until the module's results are on Kafka
#
# Both check the repos out side by side, as the README lays them out:
#   $GITHUB_WORKSPACE/p-SWAMP-sandbox/   this repo
#   $GITHUB_WORKSPACE/p-swamp/           p-SWAMP, at PSWAMP_REF (the folder name is also
#                                        the compose project name, p-swamp)
name: check-sandbox-is-in-synch-with-main-pswamp-repo

on:
  push:
    branches:
      - main
      # TEMPORARY: lets this workflow run on its own branch before it is merged.
      # REMOVE this line once the workflow is on main.
      - add-synch-CI-test
  schedule:
    - cron: "0 4 * * *"  # daily, 04:00 UTC
  workflow_dispatch:
    inputs:
      pswamp_ref:
        description: p-SWAMP branch, tag or commit to check against (empty for PSWAMP_REF's default)
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PSWAMP_REPO: p-swamp/p-swamp
  # The branch pyproject.toml installs from. Switch to main once the hook is merged there.
  PSWAMP_REF: ${{ inputs.pswamp_ref || 'feature/extra-modules-hook' }}

jobs:
  sandbox-against-pswamp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: p-SWAMP-sandbox
    env:
      MPLBACKEND: Agg  # headless: plt.show() returns at once
      # README.md's one-run override: the p-swamp checkout over the locked install.
      # Expanded unquoted on purpose, into separate arguments.
      WITH_PSWAMP_CHECKOUT: >-
        --with-editable ../p-swamp/models
        --with-editable ../p-swamp/core
        --with-editable ../p-swamp/modules/rtsim-from-cim
    steps:
      - uses: actions/checkout@v5
        with:
          path: p-SWAMP-sandbox
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.PSWAMP_REPO }}
          ref: ${{ env.PSWAMP_REF }}
          path: p-swamp
      - name: p-SWAMP commit under test
        run: git -C ../p-swamp log -1 --format='%H %s'

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: p-SWAMP-sandbox/uv.lock
      - run: uv python install 3.12
      - run: uv sync

      - name: Module tests
        run: uv run $WITH_PSWAMP_CHECKOUT pytest
      - name: scripts/offline_run.py
        run: uv run $WITH_PSWAMP_CHECKOUT python scripts/offline_run.py
      - name: scripts/power_flow.py
        run: uv run $WITH_PSWAMP_CHECKOUT python scripts/power_flow.py
      - name: scripts/live_run.py
        run: uv run $WITH_PSWAMP_CHECKOUT python scripts/live_run.py --seconds 10

  pswamp-loads-sandbox-module:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: p-swamp
    env:
      PROJECT: p-swamp
      RESULT_TOPIC: grid-monitor.my.module.result
    steps:
      - uses: actions/checkout@v5
        with:
          path: p-SWAMP-sandbox
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.PSWAMP_REPO }}
          ref: ${{ env.PSWAMP_REF }}
          path: p-swamp
      - name: p-SWAMP commit under test
        run: git log -1 --format='%H %s'

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: p-swamp/uv.lock
      - run: uv python install 3.12

      # `dev server` holds the terminal until stopped, so it runs in the background,
      # in a process group of its own for the teardown to stop. The sandbox's
      # compose.override.yml loads its bundled Nordic44: no grid download.
      - name: Start the stack with the sandbox as an external module
        run: |
          setsid uv run pswamp dev server \
            --extra-modules ../p-SWAMP-sandbox \
            -f ../p-SWAMP-sandbox/compose.override.yml \
            > "$RUNNER_TEMP/stack.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/stack.pid"

      # The first build of the image takes most of this.
      - name: Wait for the server's /healthz
        run: |
          for _ in $(seq 180); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/stack.pid")" 2>/dev/null; then
              echo "::error::pswamp dev server exited before the server came up"; exit 1
            fi
            curl -fsS http://127.0.0.1:8000/healthz > /dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "::error::no /healthz after 30 minutes"; exit 1

      - name: The extra-modules-worker hosts my-module
        run: |
          for _ in $(seq 30); do
            worker=$(docker ps -q --filter "label=com.docker.compose.project=$PROJECT" \
                                  --filter "label=com.docker.compose.service=extra-modules-worker")
            if [ -n "$worker" ] && docker logs "$worker" 2>&1 | grep -q "worker hosting .*grid-monitor/my-module"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::the extra-modules-worker never logged hosting grid-monitor/my-module"; exit 1

      # The live grid simulation feeds the module, which publishes on RESULT_TOPIC.
      - name: The module's results reach Kafka
        run: |
          kafka=$(docker ps -q --filter "label=com.docker.compose.project=$PROJECT" \
                               --filter "label=com.docker.compose.service=kafka")
          for _ in $(seq 10); do
            processed=$(docker exec "$kafka" /opt/kafka/bin/kafka-console-consumer.sh \
                          --bootstrap-server kafka:9092 --topic "$RESULT_TOPIC" \
                          --from-beginning --max-messages 1 --timeout-ms 30000 2>&1 > /dev/null || true)
            echo "$processed" | grep -q "Processed a total of [1-9]" && exit 0
            sleep 5
          done
          echo "::error::no message on $RESULT_TOPIC"; exit 1

      - name: Stack log
        if: always()
        run: cat "$RUNNER_TEMP/stack.log" || true
      - name: Container logs
        if: always()
        run: |
          for service in server extra-modules-worker; do
            for id in $(docker ps -aq --filter "label=com.docker.compose.project=$PROJECT" \
                                      --filter "label=com.docker.compose.service=$service"); do
              echo "::group::$service"
              docker logs "$id" 2>&1 | tail -n 300
              echo "::endgroup::"
            done
          done

      # Ctrl-C (SIGINT) is how `dev server` is meant to stop the stack; `down` makes sure.
      - name: Stop the stack
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/stack.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/stack.pid")
            kill -INT -- "-$pid" 2>/dev/null || true
            for _ in $(seq 30); do kill -0 "$pid" 2>/dev/null || break; sleep 2; done
            kill -KILL -- "-$pid" 2>/dev/null || true
          fi
          docker compose -p "$PROJECT" down --remove-orphans -v || true
